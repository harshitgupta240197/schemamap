[project]
name = "schemamap"
version = "0.0.1"
description = "Map a SQL Server database from system metadata only."
requires-python = ">=3.10"
license = "Apache-2.0"
dependencies = [
    "typer>=0.15",
]

[project.scripts]
schemamap = "schemamap.cli:app"

[dependency-groups]
dev = [
    "mypy>=1.13",
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "ruff>=0.8",
]

[build-system]
requires = ["uv_build>=0.12.22,<0.13.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.mypy]
strict = true
files = ["src", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=schemamap --cov-report=term-missing"
markers = [
    "integration: needs the lab SQL Server to be running",
]
