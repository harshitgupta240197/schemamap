name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cli:
    name: cli (${{ matrix.os }}, py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.10", "3.13"]
    defaults:
      run:
        working-directory: cli
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true
          cache-dependency-glob: cli/uv.lock
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy
      - run: uv run pytest -m "not integration"

  viewer:
    name: viewer (ubuntu)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: viewer
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: viewer/package-lock.json
      - run: npm ci
      - run: npm run gen:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm run check:bundle
      # `schemamap view` needs the packaged viewer; view.spec.ts runs the real CLI to make maps.
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: "3.13"
          enable-cache: true
          cache-dependency-glob: cli/uv.lock
      - name: Package the viewer for the CLI
        working-directory: .
        run: uv run tools/build_viewer.py
      - name: Build the wheel and check it carries the viewer
        working-directory: .
        run: |
          uv build --wheel --directory cli
          uv run tools/check_wheel.py cli/dist/*.whl
      - run: npx playwright install --with-deps chromium firefox
      - run: npx playwright test
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: ui-screenshots
          path: viewer/screenshots/
          if-no-files-found: ignore
          retention-days: 7
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: playwright-report
          path: |
            viewer/playwright-report/
            viewer/test-results/
          if-no-files-found: ignore
          retention-days: 7

  site:
    name: site (ubuntu)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: site/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: site-playwright-report
          path: |
            site/playwright-report/
            site/test-results/
          if-no-files-found: ignore
          retention-days: 7

  site-supabase:
    name: site (real Supabase)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: site/package-lock.json
      - run: npm ci
      - uses: supabase/setup-cli@689adcfb80d947100a1eab127289b97d1fb07b13 # v3.2.0
        with:
          version: 3.1.0
      - run: supabase start
      - run: npm run test:integration

  integration:
    name: integration (ubuntu, SQL Server 2022 CU27)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      # Pinned to a specific cumulative update, never 2022-latest (D-038). Bump deliberately.
      SCHEMAMAP_LAB_IMAGE_TAG: 2022-CU27-ubuntu-22.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: "3.13"
          enable-cache: true
          cache-dependency-glob: cli/uv.lock

      # Random per-run passwords. Masked before they are written anywhere, passed to later
      # steps as environment variables, and never written to disk (lab.py reads them from the
      # environment when there is no .env).
      - name: Generate lab passwords
        run: |
          python3 - <<'PY'
          import os
          import runpy

          lab = runpy.run_path("tools/lab.py")
          lines = []
          for key in (lab["ENV_SA"], lab["ENV_READER"]):
              value = lab["generate_password"]()
              print(f"::add-mask::{value}")
              lines.append(f"{key}={value}\n")
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as handle:
              handle.writelines(lines)
          PY

      # Keyed on each backup's file name and exact size (tests/test_ci_workflow.py keeps the
      # key in step with the catalog in tools/lab.py).
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: lab-data/backups
          key: lab-backups-AdventureWorks2022.bak-209838080-AdventureWorksDW2022.bak-101834752-WideWorldImporters-Full.bak-127111168

      # SQL Server runs as uid 10001 and must be able to write its data folder.
      - name: Prepare lab folders
        run: |
          mkdir -p lab-data/backups lab-data/mssql
          sudo chown -R 10001:0 lab-data/mssql

      - name: Start SQL Server
        run: uv run tools/lab.py up

      # The integration tests use all three sample databases. Restoring also creates the
      # schemamap_reader and schemamap_reader_min logins in each database.
      - name: Restore sample databases
        run: uv run tools/lab.py restore all

      - name: Build SchemaMapEdgeCases
        run: uv run tools/lab.py edgecases

      - name: Install CLI
        working-directory: cli
        run: uv sync --locked

      - name: Integration tests
        working-directory: cli
        run: uv run pytest -m integration -rP

      - name: SQL Server log tail
        if: failure()
        run: docker logs --tail 60 schemamap-lab
