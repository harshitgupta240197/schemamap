# SQL Server 2022 lab for Schema Map. Drive it with `uv run tools/lab.py`; see docs/LAB.md.
# Passwords come from .env, which `tools/lab.py up` generates, or (CI) from the
# SCHEMAMAP_LAB_* environment variables. Never commit .env.
# The default image tag is the cumulative update CI pins (D-040); tests/test_ci_workflow.py
# keeps the two equal. Set SCHEMAMAP_LAB_IMAGE_TAG to try another build.
name: schemamap-lab

services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:${SCHEMAMAP_LAB_IMAGE_TAG:-2022-CU27-ubuntu-22.04}
    platform: linux/amd64
    container_name: schemamap-lab
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: Developer
      MSSQL_SA_PASSWORD: ${SCHEMAMAP_LAB_SA_PASSWORD:-}
    ports:
      # Host port 14330, not 1433 (often taken). Bound to loopback so the SA
      # login is never reachable from the network.
      - "127.0.0.1:14330:1433"
    volumes:
      - ./lab-data/mssql:/var/opt/mssql
      - ./lab-data/backups:/backups:ro
      - ./tools/lab-sql:/lab-sql:ro
